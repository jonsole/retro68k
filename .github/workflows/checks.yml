name: checks

on:
  push:
  pull_request:

jobs:
  regmap:
    name: Register map
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check regmap.def against the spec and generated files
        run: python3 tools/regmap.py --verify
