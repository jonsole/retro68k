name: checks

on:
  push:
  pull_request:

jobs:
  regmap:
    name: Register map
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check regmap.def against the spec and generated files
        run: python3 tools/regmap.py --verify

  simulation:
    name: System simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install Icarus Verilog
        # A broken third-party repository on the runner image must not stop the install
        run: |
          sudo apt-get update || true
          sudo apt-get install -y iverilog
      - name: Install sv2v
        run: |
          curl -sSL -o sv2v.zip https://github.com/zachjs/sv2v/releases/download/v0.0.13/sv2v-Linux.zip
          unzip -q sv2v.zip
          echo "$PWD/sv2v-Linux" >> "$GITHUB_PATH"
      - name: Build vasm (from the copy in tools/vasm)
        run: |
          tar xzf tools/vasm/vasm.tar.gz
          make -C vasm CPU=m68k SYNTAX=mot -j4 > /dev/null
          echo "$PWD/vasm" >> "$GITHUB_PATH"
      - name: Boot ROM test, serial echo and the RESET control command
        run: make -C sim run ARGS=+serial
      - name: Boot ROM test with the DMA port busy
        run: make -C sim run ARGS=+dma
      - name: The 68000 RESET instruction resets the devices, not the CPU
        run: make -C sim rtest

  copper:
    name: Copper and audio tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update || true
          sudo apt-get install -y iverilog
      - name: Install sv2v
        run: |
          curl -sSL -o sv2v.zip https://github.com/zachjs/sv2v/releases/download/v0.0.13/sv2v-Linux.zip
          unzip -q sv2v.zip
          echo "$PWD/sv2v-Linux" >> "$GITHUB_PATH"
      - name: Build vasm (from the copy in tools/vasm)
        run: |
          tar xzf tools/vasm/vasm.tar.gz
          make -C vasm CPU=m68k SYNTAX=mot -j4 > /dev/null
          echo "$PWD/vasm" >> "$GITHUB_PATH"
      - name: Copper test ROM and frame check
        run: make -C sim ctest
      - name: Audio test, every output sample against the model
        run: make -C sim atest

  dma-io:
    name: DMA engine, SD card and keyboard tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update || true
          sudo apt-get install -y iverilog
      - name: Install sv2v
        run: |
          curl -sSL -o sv2v.zip https://github.com/zachjs/sv2v/releases/download/v0.0.13/sv2v-Linux.zip
          unzip -q sv2v.zip
          echo "$PWD/sv2v-Linux" >> "$GITHUB_PATH"
      - name: Build vasm (from the copy in tools/vasm)
        run: |
          tar xzf tools/vasm/vasm.tar.gz
          make -C vasm CPU=m68k SYNTAX=mot -j4 > /dev/null
          echo "$PWD/vasm" >> "$GITHUB_PATH"
      - name: DMA engine, random jobs against the model, and directed tests
        run: make -C sim dtest
      - name: SD card and PS/2 keyboard against their models
        run: make -C sim iotest

  lint:
    name: RTL lint (Verilator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install Verilator
        run: |
          sudo apt-get update || true
          sudo apt-get install -y verilator
      - name: No value cut short to fit (WIDTHTRUNC is an error)
        run: sh fpga/lint.sh

  ks3-synth:
    name: KS3 synthesis check (Yosys)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install Yosys
        run: |
          sudo apt-get update || true
          sudo apt-get install -y yosys
      - name: Install sv2v
        run: |
          curl -sSL -o sv2v.zip https://github.com/zachjs/sv2v/releases/download/v0.0.13/sv2v-Linux.zip
          unzip -q sv2v.zip
          echo "$PWD/sv2v-Linux" >> "$GITHUB_PATH"
      - name: Build vasm (from the copy in tools/vasm)
        run: |
          tar xzf tools/vasm/vasm.tar.gz
          make -C vasm CPU=m68k SYNTAX=mot -j4 > /dev/null
          echo "$PWD/vasm" >> "$GITHUB_PATH"
      - name: Synthesise for the XC7A35T and check it fits
        run: fpga/ks3/yosys_check.sh
